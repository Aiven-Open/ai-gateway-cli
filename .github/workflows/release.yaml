# Signs, notarizes and publishes the `aiven-ai-gateway` launcher (`RELEASING.md`). The release,
# tagged `aiven-ai-gateway-<tag>`, and the Homebrew cask land in `aiven/homebrew-tap`, written with
# `HOMEBREW_TAP_TOKEN`, so this repository's `GITHUB_TOKEN` stays read-only. The signing material
# lives in the `release` environment, whose required reviewers gate every run.
name: Release aiven-ai-gateway

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A retried tag must not race a run still publishing to the tap.
concurrency:
  group: aiven-ai-gateway-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Full history: GoReleaser reads tags and commit dates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only main's commits are released; the tag is the trigger, not the authority.
      - name: Require tagged commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          # Builds, signs, notarizes and generates the cask; the next step publishes, since GoReleaser
          # cannot set the tap-side tag.
          args: release --clean --skip=publish
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Publish to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: .github/scripts/publish-tap.sh dist
