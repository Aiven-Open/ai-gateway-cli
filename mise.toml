[tools]
go = "1.27.3"

[tasks.test]
description = "Vet, gofmt-check and test the Go launcher"
# `gofmt -l` exits 0 on a diff, so the task fails on its output; `-w` applies it.
run = '''
set -eu
go vet ./...
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt differs (run 'gofmt -w .'):" >&2
  echo "$unformatted" >&2
  exit 1
fi
go test ./...
'''
